services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: svity
      POSTGRES_PASSWORD: svity
      POSTGRES_DB: svity
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Catches every e-mail the API sends in development. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
